<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b12">
<title>VANTA AI</title>
<style>
:root{color-scheme:dark;--bg:#090b12;--panel:#111522;--line:#242b3d;--muted:#9aa4b8;--accent:#8b5cf6}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#29204b 0,transparent 48%),var(--bg);color:#f5f6fb;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center}
.app{width:min(900px,100%);height:100dvh;display:flex;flex-direction:column;padding:18px}
header{display:flex;align-items:center;gap:12px;padding:10px 4px 18px;border-bottom:1px solid var(--line)}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#a78bfa,#5b21b6);display:grid;place-items:center;font-weight:900;font-size:20px;box-shadow:0 8px 30px #8b5cf644}
h1{font-size:18px;margin:0;letter-spacing:1.5px}header p{margin:3px 0 0;color:var(--muted);font-size:12px}
.status{margin-right:auto;color:#9fe7c1;font-size:12px}.status:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#4ade80;margin-left:7px}
#chat{flex:1;overflow:auto;padding:22px 2px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
.welcome{text-align:center;margin:auto 0;color:var(--muted)}.welcome .orb{font-size:42px;margin-bottom:10px}.welcome h2{color:#fff;font-size:25px;margin:0 0 8px}.welcome p{margin:0;font-size:14px}
.msg{max-width:82%;padding:13px 16px;border:1px solid var(--line);border-radius:18px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}
.user{align-self:flex-start;background:#282044;border-color:#514078;border-bottom-right-radius:5px}
.bot{align-self:flex-end;background:var(--panel);border-bottom-left-radius:5px}
.typing{color:var(--muted);font-size:13px;align-self:flex-end}
.composer{border:1px solid #30384c;background:#111522;border-radius:20px;padding:9px;display:flex;gap:8px;box-shadow:0 10px 35px #0005}
textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:white;font:inherit;padding:10px;max-height:130px;min-height:44px}
button{border:0;border-radius:14px;background:linear-gradient(135deg,#9b7bff,#6d28d9);color:white;font-weight:700;padding:0 18px;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}.hint{text-align:center;color:#737e93;font-size:11px;padding:9px 0 0}
@media(max-width:600px){.app{padding:12px}.msg{max-width:92%}.welcome h2{font-size:22px}}
</style>
</head>
<body>
<main class="app">
<header><div class="logo">V</div><div><h1>VANTA AI</h1><p>مساعدك الذكي — اسأل اللي تبيه</p></div><div class="status">جاهز</div></header>
<section id="chat" aria-live="polite">
<div class="welcome" id="welcome"><div class="orb">✦</div><h2>وش ودك تعرف؟</h2><p>اكتب سؤالك وخلّ VANTA يساعدك.</p></div>
</section>
<form class="composer" id="form"><textarea id="prompt" rows="1" placeholder="اكتب سؤالك هنا..." aria-label="اكتب سؤالك"></textarea><button id="send" type="submit">إرسال ↵</button></form>
<div class="hint">قد يخطئ الذكاء الاصطناعي؛ تحقق من المعلومات المهمة.</div>
</main>
<script>
const form=document.querySelector('#form'), input=document.querySelector('#prompt'), chat=document.querySelector('#chat'), send=document.querySelector('#send');
function bubble(text,kind){const el=document.createElement('div');el.className='msg '+kind;el.textContent=text;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;return el}
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,130)+'px'});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
form.addEventListener('submit',async e=>{
 e.preventDefault();const q=input.value.trim();if(!q||send.disabled)return;
 document.querySelector('#welcome')?.remove();bubble(q,'user');input.value='';input.style.height='auto';send.disabled=true;send.textContent='...';
 const wait=document.createElement('div');wait.className='typing';wait.textContent='VANTA يفكر...';chat.appendChild(wait);
 try{
  const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q})});
  const data=await r.json();if(!r.ok)throw new Error(data.error||'تعذر الحصول على رد');
  bubble(data.reply||'ما قدرت أطلع رد. جرّب مرة ثانية.','bot');
 }catch(err){bubble('ما قدرت أتصل بالمساعد. تأكد أن الخادم شغال ومفتاح API مضبوط.\\n'+err.message,'bot')}
 finally{wait.remove();send.disabled=false;send.textContent='إرسال ↵';input.focus()}
});
</script>
</body></html>
